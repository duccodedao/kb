<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bmass | Auto Khám bệnh</title>
    <style>
        body {
            width: 300px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 14px;
            background: #f8fafc;
            color: #0f172a;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .header img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 6px;
        }
        .header h3 {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            color: #0284c7;
        }
        .desc {
            font-size: 12px;
            color: #475569;
            line-height: 1.4;
            margin-bottom: 12px;
        }
        .status-box {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px;
            font-size: 11px;
            text-align: center;
            color: #10b981;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="icon.png" alt="Logo" onerror="this.style.display='none'">
        <div>
            <h3>Trợ Lý HIS VNPT</h3>
        </div>
    </div>
    <div class="desc">Trợ lý tự động hóa quy trình Khám sức khỏe trên phân hệ HIS VNPT.</div>
    <div class="status-box" id="popup-status">
        Trạng thái: Sẵn sàng hoạt động trên trang Khám bệnh.
    </div>
</body>
</html>
